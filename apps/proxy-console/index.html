<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- 邮件链接把一次性令牌放在地址里。整站不发送 Referer，令牌在路由守卫移出地址栏之前也不会随首屏资源请求或外链泄露。须位于任何资源之前。 -->
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxy</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
