syntax = "proto3";

package proxycontrol.config.v1;

option go_package = "github.com/DuanJinTaoToday/proxy/apps/proxy-control/internal/conf;conf";

import "server.proto";
import "data.proto";
import "biz.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Biz biz = 3;
}

message Config {
  message Source {
    message Apollo {
      string app_id = 1;
      string cluster = 2;
      string endpoint = 3;
      string namespace = 4;
      bool enable_backup = 5;
      string backup_path = 6;
      string secret = 7;
    }
    Apollo apollo = 1;
    string file = 2;
  }

  message Zap {
    string file = 1;
    optional bool console = 2;
    int32 max_age = 3;
    string level = 4;
    int32 max_size = 5;
    int32 max_backups = 6;
  }

  Source source = 1;
  Zap zap = 2;
  reserved 3;
  reserved "telemetry";
}
