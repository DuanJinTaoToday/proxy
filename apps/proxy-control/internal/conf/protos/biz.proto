syntax = "proto3";

package proxycontrol.config.v1;

option go_package = "github.com/DuanJinTaoToday/proxy/apps/proxy-control/internal/conf;conf";

message Biz {
  reserved 1;
  reserved "access";
  Usage usage = 2;
  Subaccounts subaccounts = 3;
  IPCrown ipcrown = 4;
}

message Usage {
  uint32 max_batch_records = 1;
  uint32 max_batch_body_bytes = 2;
}

message Subaccounts {
  string password_key = 1;
  string gateway_host = 2;
  uint32 gateway_port = 3;
  bool explicit_sidtime = 4;
}

message IPCrown {
  string base_url = 1;
  string partner_id = 2;
  string api_secret = 3;
  string password_key = 4;
}
