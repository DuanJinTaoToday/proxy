syntax = "proto3";

package proxycontrol.config.v1;

option go_package = "github.com/DuanJinTaoToday/proxy/apps/proxy-control/internal/conf;conf";

message Biz {
  Access access = 1;
  Usage usage = 2;
}

message Access {
  repeated User users = 1;
  repeated Tenant tenants = 2;
}

message User {
  string username = 1;
  string password_hash = 2;
  repeated Membership memberships = 3;
  bool platform_operator = 4;
}

message Tenant {
  string id = 1;
  string name = 2;
}

message Membership {
  string tenant_id = 1;
  TenantRole role = 2;
  bool disabled = 3;
}

enum TenantRole {
  TENANT_ROLE_UNSPECIFIED = 0;
  TENANT_ROLE_MEMBER = 1;
  TENANT_ROLE_ADMIN = 2;
}

message Usage {
  uint32 max_batch_records = 1;
  uint32 max_batch_body_bytes = 2;
}
