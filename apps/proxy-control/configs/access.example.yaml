http_addr: 127.0.0.1:8000
access:
  tenants:
    - id: alpha
      name: Alpha
    - id: beta
      name: Beta
  users:
    - username: alice
      password_hash_env: PROXY_ALICE_PASSWORD_HASH
      memberships:
        - tenant_id: alpha
          role: TENANT_ROLE_ADMIN
        - tenant_id: beta
          role: TENANT_ROLE_MEMBER
    - username: bob
      password_hash_env: PROXY_BOB_PASSWORD_HASH
      memberships:
        - tenant_id: beta
          role: TENANT_ROLE_ADMIN
        - tenant_id: alpha
          role: TENANT_ROLE_MEMBER
          disabled: true
    - username: operator
      password_hash_env: PROXY_OPERATOR_PASSWORD_HASH
      platform_operator: true
