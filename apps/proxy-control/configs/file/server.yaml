# 线上运行配置模板。部署前填写实际值，凭据放在受保护的配置源。
server:
  http:
    addr:
  cron_tasks:
    # 用量归档任务。填写六段 cron 表达式，第一段为秒。
    # timeout 为 0s 时不限制单次执行时间。
    - name: MaintainUsage
      spec:
      timeout:

data:
  repo:
    # 配置数据库前先应用 migrations/ 下的 Goose 迁移。
    proxy_auth:
      database_dsn:
    usage:
      # 数据库账号需能维护用量分区。
      database_dsn:

biz:
  subaccounts:
    # 使用独立、持久保存的 32 随机字节，无填充 base64url 编码。
    password_key:
    gateway_host:
    gateway_port:
    explicit_sidtime:
  ipcrown:
    base_url:
    partner_id:
    api_secret:
    # 皇冠 IP 密码使用独立的加密密钥。
    password_key:
  usage:
    max_batch_records:
    max_batch_body_bytes:
