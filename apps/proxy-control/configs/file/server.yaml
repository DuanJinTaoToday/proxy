server:
  http:
    # HTTP 监听地址。默认只接受本机连接。
    addr: 127.0.0.1:8000
  cron_tasks:
    # 修改任务列表后自动更新调度。将列表设为 [] 会停止后续调度。
    # 启用用量模块后执行用量归档。name 对应 CronService 方法名。
    - name: MaintainUsage
      # 六段 cron 表达式，第一段为秒。每分钟的第 0 秒执行。
      spec: "0 * * * * *"
      # 0s 表示不限制单次执行时间。
      timeout: 0s

# 配置数据库前先应用 migrations/ 下的 Goose 迁移。
# 将此文件复制为 server.local.yaml，在本地副本中取消所需配置的注释并填入凭据。
# data:
#   repo:
#     proxy_auth:
#       # 用于账户访问的 PostgreSQL DSN。
#       database_dsn: ""
#     usage:
#       # 用量上报和查询使用的 PostgreSQL DSN。需能维护用量分区。
#       database_dsn: ""

biz:
  usage:
    # 单次 Recorder 上报允许的最大记录条数。
    max_batch_records: 1000
    # 单次 Recorder 上报请求体的最大字节数（1 MiB）。
    max_batch_body_bytes: 1048576
