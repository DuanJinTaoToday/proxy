# 线上运行配置模板。部署前填写实际值，凭据放在受保护的配置源。
server:
  http:
    addr:
    # 只列出管理方控制的 HTTPS 入口和中间代理地址，空列表表示不信任转发头。
    trusted_proxy_cidrs: []
  cron_tasks:
    # 用量归档任务。填写六段 cron 表达式，第一段为秒。
    # timeout 为 0s 时不限制单次执行时间。
    - name: MaintainUsage
      spec:
      timeout:

data:
  repo:
    # 配置数据库前先应用 migrations/ 下的 Goose 迁移。
    # 挂载本地 DB-IP IP to Country Lite CSV 或 CSV.GZ 数据库。
    ip_country_file:
    proxy_auth:
      database_dsn:
    usage:
      # 数据库账号需能维护用量分区。
      database_dsn:

biz:
  subaccounts:
    # 使用独立、持久保存的 32 随机字节，无填充 base64url 编码。
    password_key:
    gateway_host:
    gateway_port:
    explicit_sidtime:
  ipcrown:
    base_url:
    partner_id:
    api_secret:
    # 皇冠 IP 密码使用独立的加密密钥。
    password_key:
  # 启用邮箱注册、找回密码和运营邮件恢复时，取消本段注释并填写实际值。
  # email_auth:
  #   # 客户打开邮件链接使用的 HTTPS origin，不含路径。
  #   console_origin: https://console.example.com
  #   # 保存并在所有控制面实例间共享 32 随机字节，无填充 base64url 编码。
  #   code_key:
  #   # SMTP relay 必须支持 STARTTLS。填写 relay 的 host:port 和发件邮箱。
  #   smtp_address: smtp.example.com:587
  #   from_address: accounts@example.com
  #   # relay 需要认证时同时填写两项。将凭据存到受保护的配置源。
  #   smtp_username:
  #   smtp_password:
  #   # 仅隔离测试环境可启用明文 SMTP。
  #   allow_plaintext: false
  usage:
    max_batch_records:
    max_batch_body_bytes:
