server:
  http:
    addr: 0.0.0.0:8000
    trusted_proxy_cidrs: []
  cron_tasks:
    - name: MaintainUsage
      spec: "0 * * * * *"
      timeout: 0s
    - name: ProbeStaticExchanges
      spec: "*/5 * * * * *"
      timeout: 15s
    - name: ReconcileStaticExchanges
      spec: "*/5 * * * * *"
      timeout: 12s
data:
  repo:
    ip_country_file: /config/ip-country-fixture.csv
    proxy_auth:
      database_dsn: "postgres://proxy:proxy-local-test@db:5432/proxy?sslmode=disable"
    usage:
      database_dsn: "postgres://proxy:proxy-local-test@db:5432/proxy?sslmode=disable"

biz:
  email_auth:
    console_origin: https://localhost:8443
    code_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    smtp_address: mailpit:1025
    from_address: account@rocproxy.example.test
    allow_plaintext: true
  subaccounts:
    # Public fixture key for the local Docker environment only.
    password_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    gateway_host: 127.0.0.1
    gateway_port: 1080
