syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service UsageService {
  rpc GetTenantDailyUsage(DailyUsageRequest) returns (DailyUsageResponse) {
    option (google.api.http) = { get: "/v1/tenants/{tenant_id}/usage/daily" };
  }
  rpc GetTenantBalance(TenantBalanceRequest) returns (TenantBalance) {
    option (google.api.http) = { get: "/v1/tenants/{tenant_id}/balance" };
  }
  rpc QueryUsage(QueryUsageRequest) returns (QueryUsageResponse) {
    option (google.api.http) = { get: "/v1/operations/usage" };
  }
}

enum UsageGranularity {
  USAGE_GRANULARITY_UNSPECIFIED = 0;
  USAGE_GRANULARITY_MINUTE = 1;
  USAGE_GRANULARITY_HOUR = 2;
  USAGE_GRANULARITY_DAY = 3;
}

message QueryUsageRequest {
  string tenant_id = 1;
  string gateway_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  UsageGranularity granularity = 5;
  bool split_by_gateway = 6;
  bool split_by_grant = 7;
  int32 page_size = 8;
  string page_token = 9;
  bool split_by_rate = 10;
}

message UsageBucket {
  google.protobuf.Timestamp start_time = 1;
  string gateway_id = 2;
  string grant_id = 3;
  UsageAmount amount = 4;
  string rate_id = 5;
}

message QueryUsageResponse {
  repeated UsageBucket buckets = 1;
  string next_page_token = 2;
}

message DailyUsageRequest {
  string tenant_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message TenantBalanceRequest {
  string tenant_id = 1;
}

message UsageAmount {
  uint64 input_bytes = 1;
  uint64 output_bytes = 2;
  uint64 total_bytes = 3;
  uint64 billable_bytes = 4;
}

message DailyUsage {
  string date = 1;
  UsageAmount amount = 2;
}

message DailyUsageResponse {
  repeated DailyUsage days = 1;
  google.protobuf.Timestamp last_received_at = 2;
}

message TenantBalance {
  string tenant_id = 1;
  int64 available_bytes = 2;
  uint64 overdraft_bytes = 3;
  uint64 admission_threshold_bytes = 4;
  uint64 warning_threshold_bytes = 5;
  google.protobuf.Timestamp warning_since = 6;
  repeated TrafficGrant grants = 7;
}

message TrafficGrant {
  string grant_id = 1;
  uint64 granted_bytes = 2;
  uint64 used_bytes = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  string source = 6;
}
