syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service GatewayAuthService {
  rpc LoadAuthState(LoadAuthStateRequest) returns (AuthSnapshot) {
    option (google.api.http) = { post: "/v1/gateway/auth-state/load" body: "*" };
  }
  rpc RefreshAuthState(RefreshAuthStateRequest) returns (RefreshAuthStateResponse) {
    option (google.api.http) = { post: "/v1/gateway/auth-state/refresh" body: "*" };
  }
}

message LoadAuthStateRequest {
  string username = 1;
  string password = 2;
}

message RefreshAuthStateRequest {
  repeated string references = 1;
}

message RefreshAuthStateResponse {
  repeated AuthSnapshot snapshots = 1;
}

message AuthSnapshot {
  string reference = 1;
  string username = 2;
  string client_id = 3;
  string tenant_id = 4;
  bytes password_hash = 5;
  bool active = 6;
  google.protobuf.Timestamp expires_at = 7;
  repeated string allowed_source_cidrs = 8;
  AuthQuota quota = 9;
}

message AuthQuota {
  int64 available_bytes = 1;
  uint64 admission_threshold_bytes = 2;
  google.protobuf.Timestamp valid_until = 3;
}
