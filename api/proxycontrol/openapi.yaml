                  description: 产品类型。空值表示全部。
                  schema:
                    type: string
                - name: status
                  in: query
                  description: 交付状态。空值表示全部。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.PurchaseOrders'
    /v1/tenant/orders/traffic-packages:
        post:
            tags:
                - WalletService
