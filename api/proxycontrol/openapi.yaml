                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.StaticIPs'
    /v1/tenant/static-ips/{supplierItemId}/proxy-config:
        get:
            tags:
                - WalletService
            summary: 查看当前租户的单个静态 IP 接入信息
            operationId: WalletService_GetStaticIPConfig
            parameters:
                - name: supplierItemId
                  in: path
                  description: 需要查看接入信息的分配 ID。
                  required: true
