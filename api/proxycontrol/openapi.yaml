                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.SubaccountPassword'
    /v1/tenant/subaccounts/{clientId}/proxy-config:
        get:
            tags:
                - SubaccountService
            summary: 获取已启用子账号的 SOCKS5 接入配置
            operationId: SubaccountService_GetProxyConfig
            parameters:
                - name: clientId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.SubaccountProxyConfig'
    /v1/tenant/traffic-alert:
        get:
            tags:
                - UsageService
            summary: 查看动态流量余额和当前低余额提醒
            operationId: UsageService_GetTrafficAlert
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.TrafficAlert'
        put:
            tags:
                - UsageService
            summary: 设置或清除动态流量低余额提醒阈值
            operationId: UsageService_SetLowBalanceThreshold
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/proxycontrol.v1.SetLowBalanceThresholdRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.TrafficAlert'
    /v1/tenant/usage/daily:
        get:
            tags:
                - UsageService
            summary: 查询租户日实扣用量
            operationId: UsageService_ListDailyUsage
            parameters:
                - name: startDate
                  in: query
                  description: 上海自然日（含），格式 YYYY-MM-DD。仅填一端时查询该日，两端均省略时查询上海当天。
                  schema:
                    type: string
                - name: endDate
                  in: query
                  description: 上海自然日（含），格式 YYYY-MM-DD。
                  schema:
                    type: string
                - name: clientId
                  in: query
                  description: 可选代理子账号 ID，留空时汇总租户全部子账号。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.DailyUsageResponse'
    /v1/tenant/usage/daily.csv:
        get:
            tags:
                - UsageService
            summary: 导出租户日实扣用量
            operationId: UsageService_ExportDailyUsage
            parameters:
                - name: startDate
                  in: query
                  description: 上海自然日起点（含），格式 YYYY-MM-DD
                  schema:
                    type: string
                - name: endDate
                  in: query
                  description: 上海自然日终点（含），格式 YYYY-MM-DD
                  schema:
                    type: string
                - name: clientId
                  in: query
                  description: 可选代理子账号 ID
                  schema:
                    type: string
            responses:
                "200":
                    description: 完整筛选结果的 CSV 下载，流量单位为十进制 GB
                    content:
                        text/csv:
                            schema:
                                type: string
                                format: binary
    /v1/tenant/wallet:
        get:
            tags:
                - WalletService
            summary: 查看当前租户钱包
            operationId: WalletService_GetCustomerWallet
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.WalletTenant'
    /v1/tenant/wallet/ledger:
        get:
            tags:
                - WalletService
            summary: 查看当前租户钱包流水
            operationId: WalletService_ListCustomerWalletEntries
            parameters:
                - name: beforeId
                  in: query
                  description: 查询此编号之前的流水。默认从最新开始。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.WalletEntries'
components:
    schemas:
        proxycontrol.v1.AccessLocation:
            type: object
            properties:
                ip:
                    type: string
                    description: 本次请求的来源 IP。无法确定来源时为空。
                location:
                    type: string
                    description: 按 Accept-Language 返回的国家或地区名称。无法确定归属地时为空。
                is_mainland_china:
                    type: boolean
                    description: 仅归属地为中国大陆时为 true，未知及香港、澳门、台湾均为 false。
        proxycontrol.v1.AuthQuota:
            type: object
            properties:
                availableBytes:
                    type: string
                    description: 可用流量余额，单位为字节。
                usageVersion:
                    type: string
                    description: 该租户余额和子账号计量、上限的共同版本。
        proxycontrol.v1.AuthSnapshot:
            type: object
            properties:
                reference:
                    type: string
                    description: 绑定到当前网关的凭据引用，用于后续刷新。
                username:
                    type: string
                    description: 用于认证的用户名。
                clientId:
                    type: string
                    description: 代理凭据 ID。
                tenantId:
                    type: string
                    description: 租户 ID。
                passwordHash:
                    type: string
                    description: 供网关本地认证使用的密码哈希。
                    format: bytes
                active:
                    type: boolean
                    description: 凭据当前是否启用。
                quota:
                    allOf:
                        - $ref: '#/components/schemas/proxycontrol.v1.AuthQuota'
                    description: 有效凭据所属租户的流量准入状态。
                credentialVersion:
                    type: string
                    description: Monotonic credential revision, including password and active status changes.
                usedBytes:
                    type: string
                    description: 子账号历史累计流量，单位为字节。
                limitBytes:
                    type: string
                    description: 缺省表示不限，0 表示达到准入上限。
        proxycontrol.v1.BaseRequest:
            type: object
            properties: {}
            description: 无请求参数的接口使用 BaseRequest。
        proxycontrol.v1.BaseResp:
            type: object
            properties: {}
            description: 成功时无需返回业务数据的接口使用 BaseResp，响应体为 {}。
        proxycontrol.v1.CheckPermissionRequest:
            type: object
            properties:
                tenantId:
                    type: string
                    description: 租户 ID。
                permission:
                    type: integer
                    description: 要检查的权限。
                    format: enum
        proxycontrol.v1.CompleteReplayRequest:
            type: object
            properties:
                gatewayId:
                    type: string
                    description: 网关 ID。
                bootId:
                    type: string
                    description: 网关运行代次 ID，同一代次重放时保持一致。
                unfinishedSessionCount:
                    type: integer
                    description: 该代次上报的未完成会话数量。
                    format: uint32
                hasSessionRecords:
                    type: boolean
                    description: 该代次是否存在会话记录，保留字段缺失与显式 false 的区别。
        proxycontrol.v1.CreateSubaccountRequest:
            type: object
            properties:
                name:
                    type: string
                password:
                    type: string
                remark:
                    type: string
                active:
                    type: boolean
                limitBytes:
                    type: string
                    description: 累计流量上限，单位为字节。缺省表示不限。
        proxycontrol.v1.CustomerPurchaseOrderRequest:
            type: object
            properties:
                orderId:
                    type: string
                    description: 当前租户的订单编号。
        proxycontrol.v1.DailyUsage:
            type: object
            properties:
                date:
                    type: string
                    description: 上海自然日，格式 YYYY-MM-DD。
                billableBytes:
                    type: string
                    description: 上下行合计实扣字节数。
                updatedAt:
                    type: string
                    description: 对应筛选范围内，该日用量最近一次入库时间。
                    format: date-time
        proxycontrol.v1.DailyUsageResponse:
            type: object
            properties:
                days:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.DailyUsage'
                    description: 按日期升序返回有实扣量的天，查询区间无实扣时为空列表。
        proxycontrol.v1.ListRecordAnomaliesResponse:
            type: object
            properties:
                anomalies:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.RecordAnomaly'
                    description: 本页的异常记录。
                nextPageToken:
                    type: string
                    description: 下一页的游标。为空表示没有更多记录。
        proxycontrol.v1.ListUsageGapsResponse:
            type: object
            properties:
                gaps:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.UsageGap'
                    description: 本页的用量缺口。
                nextPageToken:
                    type: string
                    description: 下一页的游标。为空表示没有更多记录。
        proxycontrol.v1.LoadAuthStateRequest:
            type: object
            properties:
                username:
                    type: string
                    description: 用于认证的用户名。
                password:
                    type: string
                    description: 用于认证的原始密码。
        proxycontrol.v1.LoginOperatorRequest:
            type: object
            properties:
                username:
                    type: string
                    description: 独立的运营登录名。
                password:
                    type: string
                    description: 运营登录密码。
        proxycontrol.v1.LoginRequest:
            type: object
            properties:
                phone:
                    type: string
                    description: 中国大陆手机号，接受带或不带 +86。
                password:
                    type: string
                    description: 控制台登录密码。
        proxycontrol.v1.LoginResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 后续请求通过 Authorization Bearer 发送的访问令牌。
                expiresInSeconds:
                    type: integer
                    description: 令牌从签发起的有效时长，单位为秒。
                    format: int32
        proxycontrol.v1.Overview:
            type: object
            properties:
                wallet_minor:
                    type: string
                    description: 钱包可用余额，单位为人民币分。
                traffic_bytes:
                    type: string
                    description: 动态流量余额，单位为字节，可为负数。
                active_static_ip_count:
                    type: integer
                    description: 尚未到期的静态 IP 分配数量。
                    format: int32
                notices:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.OverviewNotice'
                    description: 当前提醒，无提醒时为空列表。
                products:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.OverviewProduct'
                    description: 动态和静态商品各自的当前开售状态。
                can_create_subaccount:
                    type: boolean
                    description: 当前允许创建代理子账号。禁用的子账号也占用额度。
        proxycontrol.v1.OverviewNotice:
            type: object
            properties:
                kind:
                    type: string
                    description: low_traffic_balance 表示流量低余额，static_ip_expiry 表示静态 IP 即将到期。
                count:
                    type: integer
                    description: 低余额提醒固定为 1，静态到期提醒为涉及的 IP 数量。
                    format: int32
        proxycontrol.v1.OverviewProduct:
            type: object
            properties:
                kind:
                    type: string
                    description: dynamic 或 static。
                open:
                    type: boolean
                    description: 运营设置的开售状态。
                can_purchase:
                    type: boolean
                    description: 购买入口可用。动态商品还需有在售套餐。
        proxycontrol.v1.PendingStaticPurchase:
            type: object
            properties:
                orderId:
                    type: string
                    description: 待核实的平台订单号。
                tenantId:
                    type: string
                    description: 订单所属租户。
                supplierOrderId:
                    type: string
                    description: 已关联的皇冠主订单号。空值表示待确认。
                createdAt:
                    type: string
                    description: 平台受理时间。
                    format: date-time
                deliveredCount:
                    type: string
                    description: 已确认交付的 IP 数量。
                canClose:
                    type: boolean
                    description: 超过 72 小时且可释放未知结果的剩余预扣。
                pendingRenewalItems:
                    type: array
                    items:
                        type: string
                    description: 续费订单返回仍待核实的皇冠明细 ID。购买订单为空。
        proxycontrol.v1.PendingStaticPurchases:
            type: object
            properties:
                purchases:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.PendingStaticPurchase'
                    description: 本页待核实订单。
                nextAfterId:
                    type: string
                    description: 下一页游标。零表示无更多结果。
        proxycontrol.v1.Product:
            type: object
            properties:
                kind:
                    type: string
                    description: dynamic 或 static。
                description:
                    type: string
                    description: 未开售时也公开的商品介绍。
                open:
                    type: boolean
                    description: 计费运营设置的开售状态。
                canPurchase:
                    type: boolean
                    description: 购买入口可用。动态商品还需至少一档已定价的上架套餐。
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.TrafficPackage'
                    description: 仅动态商品开售后包含已定价的上架套餐。
        proxycontrol.v1.Products:
            type: object
            properties:
                products:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.Product'
        proxycontrol.v1.PurchaseOrder:
            type: object
            properties:
                id:
                    type: string
                    description: 订单编号。
                kind:
                    type: string
                    description: 产品类型 traffic_package、static_purchase 或 static_renewal。
                status:
                    type: string
                    description: 交付状态 pending、succeeded、partial 或 failed。
                lockedMinor:
                    type: string
                    description: 确认提交时锁定的总价，人民币分。
                debitedMinor:
                    type: string
                    description: 扣款或预扣金额，人民币分。
                releasedMinor:
                    type: string
                    description: 预扣释放金额，人民币分。
                refundedMinor:
                    type: string
