                    type: string
                    description: 该统计桶的起始时间。
                    format: date-time
                gatewayId:
                    type: string
                    description: 网关 ID。
                amount:
                    allOf:
                        - $ref: '#/components/schemas/proxycontrol.v1.UsageAmount'
                    description: 该时间段的流量统计。
        proxycontrol.v1.UsageGap:
            type: object
            properties:
                gapId:
                    type: string
                    description: Empty for a pending boot that has no session reports yet.
                gatewayId:
                    type: string
                    description: 网关 ID。
                bootId:
                    type: string
                    description: 网关运行代次 ID，同一代次重放时保持一致。
                tenantId:
                    type: string
                    description: 租户 ID。
                kind:
                    type: string
                    description: 缺口类型，boot 表示运行代次，session 表示会话。
                status:
                    type: string
                    description: 回放状态，pending_replay 表示待回放，possible_gap 表示可能缺失。
                sessionId:
                    type: string
                    description: 代理会话 ID。
                fromAt:
                    type: string
                    description: 可能缺失记录的起始时间。
                    format: date-time
                detectedAt:
                    type: string
                    description: 首次检测到问题的时间。
                    format: date-time
                resolvedAt:
                    type: string
                    description: 问题解决的时间。
                    format: date-time
                exitedAt:
                    type: string
                    description: 网关退出时间。
                    format: date-time
        proxycontrol.v1.WalletEntries:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/proxycontrol.v1.WalletEntry'
                    description: 按流水编号倒序，每页最多 25 笔。
                nextBeforeId:
                    type: string
                    description: 下一页的 before_id，0 表示已到末页。
        proxycontrol.v1.WalletEntry:
            type: object
            properties:
                id:
                    type: string
                    description: 流水编号。
                orderId:
                    type: string
                    description: 关联订单编号。充值时为 0。
                kind:
                    type: string
                    description: 变动类型 recharge、debit、hold、release 或 refund。
                beforeMinor:
                    type: string
                    description: 变动前可用余额，人民币分。
                afterMinor:
                    type: string
                    description: 变动后可用余额，人民币分。
                createdAt:
                    type: string
                    description: 入账时间。
                    format: date-time
                operatorId:
                    type: string
                    description: 运营账号 ID，仅运营视图返回。
                reason:
                    type: string
                    description: 充值原因，仅运营视图返回。
                operatorName:
                    type: string
                    description: 运营登录名，仅运营视图返回。
        proxycontrol.v1.WalletRechargeQuote:
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/proxycontrol.v1.WalletTenant'
                    description: 待核对的租户及当前钱包余额。
                amountMinor:
                    type: string
                    description: 充值金额，人民币分。
                reason:
                    type: string
                    description: 运营填写的充值原因。
                expectedAfterMinor:
                    type: string
                    description: 预计到账后余额，人民币分。
                confirmationToken:
                    type: string
                    description: 绑定租户、运营账号、请求键、确认金额与原因的凭证。
                expiresAt:
                    type: string
                    description: 新提交必须在此时间之前。已入账请求仍可重试查询原流水。
                    format: date-time
        proxycontrol.v1.WalletTenant:
            type: object
            properties:
                tenantId:
                    type: string
                    description: 租户 ID。
                name:
                    type: string
                    description: 租户显示名。
                primaryAccountName:
                    type: string
                    description: 全局唯一的主账号名。
                availableMinor:
                    type: string
                    description: 可用余额，人民币分。
                availableTrafficBytes:
                    type: string
                    description: 可用流量字节数。负值为待抵扣的用量。
