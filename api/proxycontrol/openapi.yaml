            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.Subaccount'
    /v1/tenant/subaccounts/{clientId}:
        patch:
            tags:
                - SubaccountService
            summary: 按字段更新代理子账号
