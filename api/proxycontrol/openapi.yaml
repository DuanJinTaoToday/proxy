            operationId: WalletService_PurchaseTrafficPackage
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/proxycontrol.v1.PurchaseTrafficPackageRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.PurchaseOrder'
    /v1/tenant/orders/{orderId}:
        get:
            tags:
                - WalletService
            summary: 查看当前租户订单详情
            operationId: WalletService_GetCustomerPurchaseOrder
            parameters:
                - name: orderId
                  in: path
                  description: 当前租户的订单编号。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
