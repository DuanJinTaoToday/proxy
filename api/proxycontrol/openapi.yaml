                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.PurchaseOrder'
    /v1/tenant/static-renewal-quotes:
        post:
            tags:
                - WalletService
            summary: 逐项确认静态 IP 保号续费报价
            operationId: WalletService_QuoteStaticRenewal
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/proxycontrol.v1.StaticRenewalQuoteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.StaticRenewalQuote'
    /v1/tenant/subaccounts:
        get:
            tags:
                - SubaccountService
            summary: 列出当前租户的代理子账号
