components:
    schemas:
        proxycontrol.v1.AdjustBalanceRequest:
            type: object
            properties:
                tenantId:
                    type: string
                    description: 租户 ID。
                externalRef:
                    type: string
                    description: 外部操作单号，用于去重。
                mode:
                    type: integer
                    description: 调整方向，增加或扣减。
                    format: enum
                bytes:
                    type: string
                    description: 调整的流量额度，单位为字节，必须大于 0。
                grantId:
                    type: string
                    description: 扣减时指定的流量额度 ID。
                reason:
                    type: string
                    description: 写入余额流水的调整原因。
        proxycontrol.v1.AuditedTrafficGrant:
            type: object
            properties:
                grantId:
                    type: string
                    description: 流量额度 ID。
                grantedBytes:
                    type: string
                    description: 发放的流量额度，单位为字节。
                usedBytes:
                    type: string
                    description: 已消耗的流量额度，单位为字节。
                overdraftOffsetBytes:
                    type: string
                    description: 这笔流量额度用于抵扣透支的字节数。
                startsAt:
                    type: string
                    description: 流量额度开始生效的时间。
                    format: date-time
                expiresAt:
                    type: string
                    description: 失效时间。
                    format: date-time
                status:
                    type: string
                    description: 该笔额度的当前状态。
        proxycontrol.v1.AuthQuota:
            type: object
            properties:
                availableBytes:
                    type: string
