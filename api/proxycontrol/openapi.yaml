                            $ref: '#/components/schemas/proxycontrol.v1.UpdateSubaccountRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.Subaccount'
    /v1/tenant/subaccounts/{clientId}/password:
        get:
            tags:
                - SubaccountService
            summary: 查看当前租户子账号的密码
            operationId: SubaccountService_RevealSubaccountPassword
            parameters:
                - name: clientId
                  in: path
                  required: true
