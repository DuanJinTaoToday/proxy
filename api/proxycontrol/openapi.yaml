            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/proxycontrol.v1.StaticIPExpiryNotices'
    /v1/tenant/static-ips:
        get:
            tags:
                - WalletService
            summary: 查看当前租户的静态 IP 分配及到期记录
            operationId: WalletService_ListStaticIPs
