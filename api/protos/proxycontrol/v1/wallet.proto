syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "proxycontrol/v1/common.proto";
import "validate/validate.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

// The TXT response is streamed by a Go HTTP route.
option (openapi.v3.document) = {
  paths: { path: {
    name: "/v1/tenant/static-ips:export"
    value: { post: {
      tags: "WalletService"
      summary: "导出所选可用静态 IP 的 TXT"
      operation_id: "WalletService_ExportStaticIPs"
      request_body: { request_body: {
        required: true
        content: { additional_properties: {
          name: "application/json"
          value: { schema: { schema: {
            type: "object"
            required: "supplier_item_ids"
            properties: { additional_properties: {
              name: "supplier_item_ids"
              value: { schema: { type: "array" min_items: 1 max_items: 1000 unique_items: true items: { schema_or_reference: { schema: { type: "string" } } } } }
            } }
          } } }
        } }
      } }
      responses: { response_or_reference: {
        name: "200"
        value: { response: {
          description: "每行 IP:端口:用户名:密码"
          content: { additional_properties: { name: "text/plain" value: { schema: { schema: { type: "string" format: "binary" } } } } }
        } }
      } }
    } }
  } }
};

service WalletService {
  rpc QuoteStaticRenewal(StaticRenewalQuoteRequest) returns (StaticRenewalQuote) {
    option (google.api.http) = {post: "/v1/tenant/static-renewal-quotes", body: "*"};
    option (openapi.v3.operation) = {summary: "逐项确认静态 IP 保号续费报价"};
  }

  rpc RenewStatic(StaticRenewalRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/tenant/static-renewal-orders", body: "*"};
    option (openapi.v3.operation) = {summary: "提交单个或批量保号续费"};
  }

  rpc RecheckStaticRenewal(CustomerPurchaseOrderRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/tenant/static-renewal-orders/{order_id}/recheck", body: "*"};
    option (openapi.v3.operation) = {summary: "用原皇冠订单核对续费结果"};
  }

  rpc ResolveStaticRenewal(StaticRenewalResolutionRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}/orders/{order_id}/renewal-resolution", body: "*"};
    option (openapi.v3.operation) = {summary: "核实并处理静态 IP 续费明细"};
  }
  rpc ListStaticOffers(BaseRequest) returns (StaticOffers) {
    option (google.api.http) = {get: "/v1/public/static-offers"};
    option (openapi.v3.operation) = {summary: "查询公开静态 IP 报价及开售状态"};
  }

  rpc QuoteStaticPurchase(StaticPurchaseQuoteRequest) returns (StaticPurchaseQuote) {
    option (google.api.http) = {post: "/v1/tenant/static-purchase-quotes", body: "*"};
    option (openapi.v3.operation) = {summary: "生成当前租户的静态 IP 报价确认凭证"};
  }

  rpc PurchaseStaticIP(PurchaseStaticIPRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/tenant/static-orders", body: "*"};
    option (openapi.v3.operation) = {summary: "按确认报价购买静态 IP"};
  }

  rpc ListStaticIPs(BaseRequest) returns (StaticIPs) {
    option (google.api.http) = {get: "/v1/tenant/static-ips"};
    option (openapi.v3.operation) = {summary: "查看当前租户的静态 IP 分配及到期记录"};
  }

  rpc ClaimStaticIPExpiryNotices(BaseRequest) returns (StaticIPExpiryNotices) {
    option (google.api.http) = {post: "/v1/tenant/static-ip-expiry-notices", body: "*"};
    option (openapi.v3.operation) = {summary: "领取当前租户尚未提示的静态 IP 到期提醒"};
  }

  rpc GetStaticIPConfig(StaticIPConfigRequest) returns (StaticIP) {
    option (google.api.http) = {get: "/v1/tenant/static-ips/{supplier_item_id}/proxy-config"};
    option (openapi.v3.operation) = {summary: "查看当前租户的单个静态 IP 接入信息"};
  }

  rpc ListPendingStaticPurchases(PendingStaticPurchasesRequest) returns (PendingStaticPurchases) {
    option (google.api.http) = {get: "/v1/operations/orders/static-pending"};
    option (openapi.v3.operation) = {summary: "查看超过 24 小时未确认的静态采购订单"};
  }

  rpc ResolveStaticPurchase(ResolveStaticPurchaseRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}/orders/{order_id}/static-resolution", body: "*"};
    option (openapi.v3.operation) = {summary: "核实并处理静态采购的剩余交付"};
  }

  rpc FindTenants(FindWalletTenantRequest) returns (WalletTenant) {
    option (google.api.http) = {get: "/v1/operations/tenants"};
    option (openapi.v3.operation) = {summary: "按主账号名或手机号查找租户"};
  }

  rpc GetTenant(WalletTenantRequest) returns (WalletTenant) {
    option (google.api.http) = {get: "/v1/operations/tenants/{tenant_id}"};
    option (openapi.v3.operation) = {summary: "查看运营租户钱包"};
  }

  rpc QuoteWalletRecharge(QuoteWalletRechargeRequest) returns (WalletRechargeQuote) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}/wallet/recharge-quotes", body: "*"};
    option (openapi.v3.operation) = {summary: "获取运营钱包充值确认信息"};
  }

  rpc RechargeWallet(RechargeWalletRequest) returns (WalletEntry) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}/wallet/recharges", body: "*"};
    option (openapi.v3.operation) = {summary: "确认运营钱包充值"};
  }

  rpc ListOperatorWalletEntries(OperatorWalletEntriesRequest) returns (WalletEntries) {
    option (google.api.http) = {get: "/v1/operations/tenants/{tenant_id}/wallet/ledger"};
    option (openapi.v3.operation) = {summary: "查看租户钱包流水"};
  }

  rpc ListCustomerWalletEntries(CustomerWalletEntriesRequest) returns (WalletEntries) {
    option (google.api.http) = {get: "/v1/tenant/wallet/ledger"};
    option (openapi.v3.operation) = {summary: "查看当前租户钱包流水"};
  }

  rpc GetCustomerWallet(BaseRequest) returns (WalletTenant) {
    option (google.api.http) = {get: "/v1/tenant/wallet"};
    option (openapi.v3.operation) = {summary: "查看当前租户钱包"};
  }

  rpc PurchaseTrafficPackage(PurchaseTrafficPackageRequest) returns (PurchaseOrder) {
    option (google.api.http) = {post: "/v1/tenant/orders/traffic-packages", body: "*"};
    option (openapi.v3.operation) = {summary: "确认购买一份固定流量套餐并使用钱包结算"};
  }

  rpc ListOperatorPurchaseOrders(OperatorPurchaseOrdersRequest) returns (PurchaseOrders) {
    option (google.api.http) = {get: "/v1/operations/tenants/{tenant_id}/orders"};
    option (openapi.v3.operation) = {summary: "筛选租户订单"};
  }

  rpc ListCustomerPurchaseOrders(CustomerPurchaseOrdersRequest) returns (PurchaseOrders) {
    option (google.api.http) = {get: "/v1/tenant/orders"};
    option (openapi.v3.operation) = {summary: "筛选当前租户订单"};
  }

  rpc GetOperatorPurchaseOrder(OperatorPurchaseOrderRequest) returns (PurchaseOrder) {
    option (google.api.http) = {get: "/v1/operations/tenants/{tenant_id}/orders/{order_id}"};
    option (openapi.v3.operation) = {summary: "查看租户订单详情"};
  }

  rpc GetCustomerPurchaseOrder(CustomerPurchaseOrderRequest) returns (PurchaseOrder) {
    option (google.api.http) = {get: "/v1/tenant/orders/{order_id}"};
    option (openapi.v3.operation) = {summary: "查看当前租户订单详情"};
  }
}

message PurchaseTrafficPackageRequest {
  // 已确认的公开报价套餐 ID。
  string package_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 已确认的套餐版本。变更后须重新确认。
  int64 package_version = 2 [(validate.rules).int64.gt = 0];
  // 单次购买的幂等键。结果未知时使用原请求重试。
  string request_key = 3 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
}

message FindWalletTenantRequest {
  // 精确匹配主账号名，或手机号（可省略 +86）。
  string query = 1 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
}

message WalletTenantRequest {
  // 租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
}

message QuoteWalletRechargeRequest {
  // 待核对的租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 单次充值的幂等键。结果未知时使用同一请求重试。
  string request_key = 2 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 充值金额，人民币分。
  int64 amount_minor = 3 [(validate.rules).int64.gt = 0];
  // 运营填写的充值原因。
  string reason = 4 [(validate.rules).string = {min_len: 1, max_bytes: 500}];
}

message WalletRechargeQuote {
  // 待核对的租户及当前钱包余额。
  WalletTenant tenant = 1;
  // 充值金额，人民币分。
  int64 amount_minor = 2;
  // 运营填写的充值原因。
  string reason = 3;
  // 预计到账后余额，人民币分。
  int64 expected_after_minor = 4;
  // 绑定租户、运营账号、请求键、确认金额与原因的凭证。
  string confirmation_token = 5;
  // 新提交必须在此时间之前。已入账请求仍可重试查询原流水。
  google.protobuf.Timestamp expires_at = 6;
}

message RechargeWalletRequest {
  // 已核对的租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 获取确认信息时提供的请求键。
  string request_key = 2 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 获取确认信息时返回的凭证。
  string confirmation_token = 3 [(validate.rules).string = {len: 36}];
}

message WalletTenant {
  // 租户 ID。
  string tenant_id = 1;
  // 租户显示名。
  string name = 2;
  // 全局唯一的主账号名。
  string primary_account_name = 3;
  // 可用余额，人民币分。
  int64 available_minor = 4;
  // 可用流量字节数。负值为待抵扣的用量。
  int64 available_traffic_bytes = 5;
  // 当前租户累计充值，人民币分，以十进制字符串返回。
  string total_recharge_minor = 6;
  // 当前租户累计净实扣，人民币分，以十进制字符串返回。
  string total_spend_minor = 7;
}

message WalletEntry {
  // 流水编号。
  int64 id = 1;
  // 关联订单编号。充值时为 0。
  int64 order_id = 2;
  // 变动类型 recharge、debit、hold、release 或 refund。
  string kind = 3;
  // 变动前可用余额，人民币分。
  int64 before_minor = 4;
  // 变动后可用余额，人民币分。
  int64 after_minor = 5;
  // 入账时间。
  google.protobuf.Timestamp created_at = 6;
  // 运营账号 ID，仅运营视图返回。
  string operator_id = 7;
  // 充值原因，仅运营视图返回。
  string reason = 8;
  // 运营登录名，仅运营视图返回。
  string operator_name = 9;
}

message WalletEntries {
  // 按流水编号倒序，每页最多 25 笔。
  repeated WalletEntry entries = 1;
  // 下一页的 before_id，0 表示已到末页。
  int64 next_before_id = 2;
}

message PurchaseOrders {
  // 按订单编号倒序，每页最多 25 笔。
  repeated PurchaseOrder orders = 1;
  // 下一页的 before_id，0 表示已到末页。
  int64 next_before_id = 2;
  // 当前租户确认中的订单总数，与筛选和游标无关。
  int64 pending_count = 3;
}

message PurchaseOrder {
  // 订单编号。
  int64 id = 1;
  // 产品类型 traffic_package、static_purchase 或 static_renewal。
  string kind = 2;
  // 交付状态 pending、succeeded、partial 或 failed。
  string status = 3;
  // 确认提交时锁定的总价，人民币分。
  int64 locked_minor = 4;
  // 扣款或预扣金额，人民币分。
  int64 debited_minor = 5;
  // 预扣释放金额，人民币分。
  int64 released_minor = 6;
  // 已退回的总金额，包含释放的预扣，人民币分。
  int64 refunded_minor = 7;
  // 流量实际到账字节数。静态 IP 订单为 0。
  int64 delivered_bytes = 8;
  // 静态 IP 实际交付或续费数量。流量订单为 0。
  int64 delivered_count = 9;
  // 下单时间。
  google.protobuf.Timestamp created_at = 10;
  // 静态订单提交时预扣的金额，人民币分。流量订单为 0。
  int64 prepaid_minor = 11;
  // 已确认实扣且未退回的金额，人民币分。
  int64 settled_minor = 12;
  // 预扣中仍待确认实扣或退回的金额，人民币分。
  int64 unsettled_minor = 13;
  // 详情返回已锁定的商品明细及逐项交付数量。
  repeated PurchaseOrderItem items = 14;
  // 客户订单详情中的关联资金流水。
  repeated WalletEntry wallet_entries = 15;
  // 客户列表中的首条锁定明细，用于摘要展示。
  PurchaseOrderItem summary_item = 16;
  // 客户列表中的锁定明细行数。
  int64 item_count = 17;
}

message PurchaseOrderItem {
  // 订单内的明细序号，从 1 开始。
  int32 position = 1;
  // 下单时锁定的商品规格描述。
  string specification = 2;
  // 锁定的套餐容量，字节。静态订单为 0。
  int64 capacity_bytes = 3;
  // 锁定的采购或续费租期，天。流量订单为 0。
  int32 term_days = 4;
  // 锁定的商品单价，人民币分。
  int64 unit_minor = 5;
  // 申请购买或续费的数量。
  int32 quantity = 6;
  // 实际到账的套餐数量，或实际交付、续费的 IP 数量。
  int32 delivered_count = 7;
}

message CustomerWalletEntriesRequest {
  // 查询此编号之前的流水。默认从最新开始。
  int64 before_id = 1 [(validate.rules).int64.gte = 0];
  // 流水类型。debit 包含预扣，refund 包含预扣释放。
  string kind = 2 [(validate.rules).string = {in: ["", "recharge", "debit", "hold", "release", "refund"]}];
  // 上海业务日起点（YYYY-MM-DD），包含当天。
  string start_date = 3;
  // 上海业务日终点（YYYY-MM-DD），包含当天。
  string end_date = 4;
}

message OperatorWalletEntriesRequest {
  // 租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 查询此编号之前的流水。默认从最新开始。
  int64 before_id = 2 [(validate.rules).int64.gte = 0];
}

message CustomerPurchaseOrdersRequest {
  // 查询此编号之前的订单。默认从最新开始。
  int64 before_id = 1 [(validate.rules).int64.gte = 0];
  // 订单类型。空值表示全部。
  string kind = 2 [(validate.rules).string = {in: ["", "traffic_package", "static_purchase", "static_renewal"]}];
  // 交付状态。空值表示全部。
  string status = 3 [(validate.rules).string = {in: ["", "pending", "succeeded", "partial", "failed"]}];
  // 精确匹配订单号，0 表示全部。
  int64 order_id = 4 [(validate.rules).int64.gte = 0];
  // 上海业务日起点（YYYY-MM-DD），包含当天。
  string start_date = 5;
  // 上海业务日终点（YYYY-MM-DD），包含当天。
  string end_date = 6;
  // 产品分组。static 包含购买和续费。
  string product = 7 [(validate.rules).string = {in: ["", "dynamic", "static"]}];
}

message OperatorPurchaseOrdersRequest {
  // 租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 查询此编号之前的订单。默认从最新开始。
  int64 before_id = 2 [(validate.rules).int64.gte = 0];
  // 产品类型。空值表示全部。
  string kind = 3 [(validate.rules).string = {in: ["", "traffic_package", "static_purchase", "static_renewal"]}];
  // 交付状态。空值表示全部。
  string status = 4 [(validate.rules).string = {in: ["", "pending", "succeeded", "partial", "failed"]}];
}

message CustomerPurchaseOrderRequest {
  // 当前租户的订单编号。
  int64 order_id = 1 [(validate.rules).int64.gt = 0];
}

message OperatorPurchaseOrderRequest {
  // 租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 该租户的订单编号。
  int64 order_id = 2 [(validate.rules).int64.gt = 0];
}

message StaticOffer {
  // 皇冠节点 ID，与租期代码共同标识报价。
  int64 node_id = 1;
  // 节点地域显示名。
  string region = 2;
  // 皇冠返回的类型描述，空值表示未提供。
  string ip_type = 3;
  // 皇冠租期代码。
  string term = 4;
  // 租期长度，单位天。
  int32 term_days = 5;
  // 每个 IP 所选租期总价，单位人民币分。
  int64 unit_minor = 6;
  // 当前可购 IP 数量，缺省为零。
  int32 available = 7;
}

message StaticOffers {
  // 目录当次查回的报价。未开售返回空列表。
  repeated StaticOffer offers = 1;
  // 商品开售状态。
  bool open = 2;
  // 报价查询完成时间。未开售时省略。
  google.protobuf.Timestamp quoted_at = 3;
}

message StaticPurchaseQuoteRequest {
  // 客户选中的皇冠节点 ID。
  int64 node_id = 1 [(validate.rules).int64.gt = 0];
  // 客户选中的租期代码。
  string term = 2 [(validate.rules).string = {min_len: 1, max_bytes: 16}];
  // 请求购买的 IP 数量。
  int32 quantity = 3 [(validate.rules).int32.gt = 0];
}

message StaticPurchaseQuote {
  // 当前供应商报价和可购量。
  StaticOffer offer = 1;
  // 客户待确认的 IP 数量。
  int32 quantity = 2;
  // 绑定租户、规格、数量、价格和有效期的凭证。
  string confirmation_token = 3;
  // 新订单可使用该凭证的截止时间。
  google.protobuf.Timestamp expires_at = 4;
}

message PurchaseStaticIPRequest {
  // 已确认的皇冠节点 ID。
  int64 node_id = 1 [(validate.rules).int64.gt = 0];
  // 已确认的租期代码。
  string term = 2 [(validate.rules).string = {min_len: 1, max_bytes: 16}];
  // 已确认的 IP 数量。
  int32 quantity = 3 [(validate.rules).int32.gt = 0];
  // 已确认的租期单价，人民币分。
  int64 unit_minor = 4 [(validate.rules).int64.gt = 0];
  // 单次购买的幂等键。结果未知时保留原凭证并用同键重试。
  string request_key = 5 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 报价确认凭证。
  string confirmation_token = 6 [(validate.rules).string = {min_len: 1, max_bytes: 1024}];
}

message StaticIP {
  // 当前分配的皇冠明细 ID。
  string supplier_item_id = 1;
  // 对应平台购买订单号。
  int64 order_id = 2;
  // 代理 IP。
  string ip = 3;
  // 代理端口。
  int32 port = 4;
  // 代理用户名。只在接入配置返回。
  string username = 5;
  // 代理密码。只在接入配置返回。
  string password = 6;
  // 皇冠返回的逐 IP 到期时间。
  google.protobuf.Timestamp expires_at = 7;
}

message StaticIPs {
  // 当前租户的全部分配，含到期历史。
  repeated StaticIP allocations = 1;
}

message StaticIPConfigRequest {
  // 需要查看接入信息的分配 ID。
  string supplier_item_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
}

message StaticIPExportRequest {
  // 选中且仍可用的分配 ID。一次最多 1000 项。
  repeated string supplier_item_ids = 1 [(validate.rules).repeated = {min_items: 1, max_items: 1000, unique: true, items: {string: {min_len: 1, max_bytes: 128}}}];
}

message ResolveStaticPurchaseRequest {
  // 待核实订单所属租户。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 待核实的平台订单编号。
  int64 order_id = 2 [(validate.rules).int64.gt = 0];
  // 经运营确认关联的皇冠主订单号。空值沿用平台已有编号。
  string supplier_order_id = 3 [(validate.rules).string.max_bytes = 128];
  // 运营确认的订单关联和处理依据。
  string evidence = 4 [(validate.rules).string = {min_len: 1, max_bytes: 500}];
  // 关闭剩余并退回预扣。默认只同步已知交付。
  bool close_remaining = 5;
  // 有明确失败证据时允许在 72 小时前释放。只能配合 close_remaining。
  bool confirmed_undeliverable = 6;
}

message PendingStaticPurchasesRequest {
  // 上页最后一项平台订单号。缺省为零并从第一页查询。
  int64 after_id = 1 [(validate.rules).int64.gte = 0];
}

message PendingStaticPurchase {
  // 待核实的平台订单号。
  int64 order_id = 1;
  // 订单所属租户。
  string tenant_id = 2;
  // 已关联的皇冠主订单号。空值表示待确认。
  string supplier_order_id = 3;
  // 平台受理时间。
  google.protobuf.Timestamp created_at = 4;
  // 已确认交付的 IP 数量。
  int64 delivered_count = 5;
  // 超过 72 小时且可释放未知结果的剩余预扣。
  bool can_close = 6;
  // 续费订单返回仍待核实的皇冠明细 ID。购买订单为空。
  repeated string pending_renewal_items = 7;
}

message PendingStaticPurchases {
  // 本页待核实订单。
  repeated PendingStaticPurchase purchases = 1;
  // 下一页游标。零表示无更多结果。
  int64 next_after_id = 2;
}

message StaticIPExpiryNotices {
  // 即将到期且本次首次提示的分配数量。缺省为零。
  int32 count = 1;
}

message StaticRenewalQuoteRequest {
  // 属于当前租户且未到期的皇冠明细 ID，单个为长度 1。
  repeated string supplier_item_ids = 1 [(validate.rules).repeated = {min_items: 1, max_items: 25, unique: true, items: {string: {min_len: 1, max_bytes: 128}}}];
  // 统一的皇冠租期代码。
  string term = 2 [(validate.rules).string = {min_len: 1, max_bytes: 16}];
}

message StaticRenewalQuoteLine {
  // 报价对应的皇冠明细 ID。
  string supplier_item_id = 1;
  // 保留的原 IP。
  string ip = 2;
  // 该 IP 的续费价，人民币分。
  int64 unit_minor = 3;
  // 从原到期时间顺延的天数。
  int32 term_days = 4;
  // 报价时的原到期时间。
  google.protobuf.Timestamp original_expiry = 5;
}

message StaticRenewalQuote {
  // 本次续费的全部明细。
  repeated StaticRenewalQuoteLine lines = 1;
  // 绑定租户、明细、租期、价格、到期时间的确认凭证。
  string confirmation_token = 2;
  // 新提交可使用凭证的截止时间。
  google.protobuf.Timestamp expires_at = 3;
}

message StaticRenewalRequest {
  // 已确认的全部分配 ID。
  repeated string supplier_item_ids = 1 [(validate.rules).repeated = {min_items: 1, max_items: 25, unique: true, items: {string: {min_len: 1, max_bytes: 128}}}];
  // 已确认的统一租期代码。
  string term = 2 [(validate.rules).string = {min_len: 1, max_bytes: 16}];
  // 单次续费的幂等键。结果未知时沿用原值。
  string request_key = 3 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 原报价凭证。
  string confirmation_token = 4 [(validate.rules).string = {min_len: 1, max_bytes: 16384}];
}

message StaticRenewalResolutionRequest {
  // 待核实订单所属租户。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 平台续费订单 ID。
  int64 order_id = 2 [(validate.rules).int64.gt = 0];
  // 需要核实的皇冠明细 ID。
  string supplier_item_id = 3 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 运营核实依据。
  string evidence = 4 [(validate.rules).string = {min_len: 1, max_bytes: 500}];
  // 满 72 小时后关闭结果未知的明细，默认仅查单。
  bool close_unknown = 5;
  // 有明确失败证据时释放预扣，默认仅查单。
  bool confirmed_failure = 6;
}
