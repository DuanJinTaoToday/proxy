syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "proxycontrol/v1/common.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

// ExportDailyUsage is served directly by Go so its response is a download.
option (openapi.v3.document) = {
  paths: { path: {
    name: "/v1/tenant/usage/daily.csv"
    value: { get: {
      tags: "UsageService"
      summary: "导出租户日实扣用量"
      operation_id: "UsageService_ExportDailyUsage"
      parameters: { parameter: { name: "startDate" in: "query" description: "上海自然日起点（含），格式 YYYY-MM-DD" schema: { schema: { type: "string" } } } }
      parameters: { parameter: { name: "endDate" in: "query" description: "上海自然日终点（含），格式 YYYY-MM-DD" schema: { schema: { type: "string" } } } }
      parameters: { parameter: { name: "clientId" in: "query" description: "可选代理子账号 ID" schema: { schema: { type: "string" } } } }
      responses: { response_or_reference: {
        name: "200"
        value: { response: {
          description: "完整筛选结果的 CSV 下载，流量单位为十进制 GB"
          content: { additional_properties: { name: "text/csv" value: { schema: { schema: { type: "string" format: "binary" } } } } }
        } }
      } }
    } }
  } }
};

service UsageService {
  rpc ListDailyUsage(DailyUsageRequest) returns (DailyUsageResponse) {
    option (google.api.http) = { get: "/v1/tenant/usage/daily" };
    option (openapi.v3.operation) = { summary: "查询租户日实扣用量" };
  }
  rpc GetTrafficAlert(BaseRequest) returns (TrafficAlert) {
    option (google.api.http) = { get: "/v1/tenant/traffic-alert" };
    option (openapi.v3.operation) = { summary: "查看动态流量余额和当前低余额提醒" };
  }
  rpc SetLowBalanceThreshold(SetLowBalanceThresholdRequest) returns (TrafficAlert) {
    option (google.api.http) = { put: "/v1/tenant/traffic-alert" body: "*" };
    option (openapi.v3.operation) = { summary: "设置或清除动态流量低余额提醒阈值" };
  }
  rpc QueryUsage(QueryUsageRequest) returns (QueryUsageResponse) {
    option (google.api.http) = { get: "/v1/operations/usage" };
    option (openapi.v3.operation) = {
      summary: "按时间和维度查询运营用量"
    };
  }
  rpc ListRecordAnomalies(ListRecordAnomaliesRequest) returns (ListRecordAnomaliesResponse) {
    option (google.api.http) = { get: "/v1/operations/anomalies" };
    option (openapi.v3.operation) = {
      summary: "分页查询 Recorder 记录异常"
    };
  }
  rpc ListUsageGaps(ListUsageGapsRequest) returns (ListUsageGapsResponse) {
    option (google.api.http) = { get: "/v1/operations/gaps" };
    option (openapi.v3.operation) = {
      summary: "分页查询待回放或可能缺失的用量"
    };
  }
}

message DailyUsageRequest {
  // 上海自然日（含），格式 YYYY-MM-DD。仅填一端时查询该日，两端均省略时查询上海当天。
  string start_date = 1 [(validate.rules).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", ignore_empty: true}];
  // 上海自然日（含），格式 YYYY-MM-DD。
  string end_date = 2 [(validate.rules).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", ignore_empty: true}];
  // 可选代理子账号 ID，留空时汇总租户全部子账号。
  string client_id = 3 [(validate.rules).string = {uuid: true, ignore_empty: true}];
}

message DailyUsage {
  // 上海自然日，格式 YYYY-MM-DD。
  string date = 1;
  // 上下行合计实扣字节数。
  int64 billable_bytes = 2;
  // 对应筛选范围内，该日用量最近一次入库时间。
  google.protobuf.Timestamp updated_at = 3;
}

message DailyUsageResponse {
  // 按日期升序返回有实扣量的天，查询区间无实扣时为空列表。
  repeated DailyUsage days = 1;
}

message SetLowBalanceThresholdRequest {
  // 非负字节数，传 null 或省略时停用提醒。
  optional int64 threshold_bytes = 1 [(validate.rules).int64.gte = 0];
}

message TrafficAlert {
  // 保留负值以表示欠费。
  int64 available_bytes = 1;
  // 阈值字节数，未设置时省略。
  optional int64 threshold_bytes = 2;
  // 当前提醒周期。当前无需提醒时省略。
  int64 occurrence = 3;
  // 当前周期第一次触发的时间，当前无需提醒时省略。
  google.protobuf.Timestamp triggered_at = 4;
}

message ListRecordAnomaliesRequest {
  // 网关 ID。
  string gateway_id = 1;
  // 网关运行代次 ID，同一代次重放时保持一致。
  string boot_id = 2;
  // 租户 ID。
  string tenant_id = 3;
  // 异常类型筛选条件，留空时查询全部类型。
  string kind = 4;
  // 每页条数，取值为 1–500。省略或传 0 时使用 100。
  int32 page_size = 5 [(validate.rules).int32 = {gte: 0, lte: 500}];
  // 上一页返回的游标。查询条件应与上一页一致，首屏留空。
  string page_token = 6;
  // 处理状态：open 为未解决，resolved 为已解决，省略或 all 为全部。
  string resolution = 7;
}

message RecordAnomaly {
  // 异常记录 ID。
  string anomaly_id = 1;
  // 网关 ID。
  string gateway_id = 2;
  // 网关运行代次 ID，同一代次重放时保持一致。
  string boot_id = 3;
  // 租户 ID。
  string tenant_id = 4;
  // Recorder 记录的异常类型。
  string kind = 5;
  // Recorder 文件标识，同一文件重放时保持一致。
  string file_id = 6;
  // 记录在文件中的起始字节偏移，从 0 开始。
  uint64 file_offset = 7;
  // 首次检测到问题的时间。
  google.protobuf.Timestamp detected_at = 8;
  // 问题解决的时间。
  google.protobuf.Timestamp resolved_at = 9;
  // 有归属时的租户名称。
  string tenant_name = 10;
}

message ListRecordAnomaliesResponse {
  // 本页的异常记录。
  repeated RecordAnomaly anomalies = 1;
  // 下一页的游标。为空表示没有更多记录。
  string next_page_token = 2;
  // 首屏查询范围内的未解决总数，不受处理状态筛选影响。
  int64 open_count = 3;
}

message ListUsageGapsRequest {
  // 网关 ID。
  string gateway_id = 1;
  // 网关运行代次 ID，同一代次重放时保持一致。
  string boot_id = 2;
  // 租户 ID。
  string tenant_id = 3;
  // 缺口类型筛选条件，支持 boot 或 session。
  string kind = 4;
  // 每页条数，取值为 1–500。省略或传 0 时使用 100。
  int32 page_size = 5 [(validate.rules).int32 = {gte: 0, lte: 500}];
  // 上一页返回的游标。查询条件应与上一页一致，首屏留空。
  string page_token = 6;
  // 缺口状态筛选条件，支持 pending_replay 或 possible_gap。
  string status = 7;
  // 处理状态：open 为未解决，resolved 为已解决，省略或 all 为全部。
  string resolution = 8;
}

message UsageGap {
  // Empty for a pending boot that has no session reports yet.
  string gap_id = 1;
  // 网关 ID。
  string gateway_id = 2;
  // 网关运行代次 ID，同一代次重放时保持一致。
  string boot_id = 3;
  // 租户 ID。
  string tenant_id = 4;
  // 缺口类型，boot 表示运行代次，session 表示会话。
  string kind = 5;
  // 回放状态，pending_replay 表示待回放，possible_gap 表示可能缺失。
  string status = 6;
  // 代理会话 ID。
  string session_id = 7;
  // 可能缺失记录的起始时间。
  google.protobuf.Timestamp from_at = 8;
  // 首次检测到问题的时间。
  google.protobuf.Timestamp detected_at = 9;
  // 问题解决的时间。
  google.protobuf.Timestamp resolved_at = 10;
  // 网关退出时间。
  google.protobuf.Timestamp exited_at = 11;
  // 有归属时的租户名称。
  string tenant_name = 12;
}

message ListUsageGapsResponse {
  // 本页的用量缺口。
  repeated UsageGap gaps = 1;
  // 下一页的游标。为空表示没有更多记录。
  string next_page_token = 2;
  // 首屏查询范围内的未解决总数，不受缺口状态或处理状态筛选影响。
  int64 open_count = 3;
}

enum UsageGranularity {
  USAGE_GRANULARITY_UNSPECIFIED = 0;
  USAGE_GRANULARITY_MINUTE = 1;
  USAGE_GRANULARITY_HOUR = 2;
  USAGE_GRANULARITY_DAY = 3;
}

message QueryUsageRequest {
  // 租户 ID。
  string tenant_id = 1 [(validate.rules).string.min_bytes = 1];
  // 网关 ID。
  string gateway_id = 2;
  // 统计区间起点（含）。
  google.protobuf.Timestamp start_time = 3 [(validate.rules).timestamp.required = true];
  // 统计区间终点（不含）。
  google.protobuf.Timestamp end_time = 4 [(validate.rules).timestamp.required = true];
  // 统计粒度。按日查询时，以落在区间内的上海零点选择完整自然日。
  UsageGranularity granularity = 5 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // 是否按网关拆分统计。
  bool split_by_gateway = 6;
  // 每页条数，取值为 1–500。省略或传 0 时使用 100。
  int32 page_size = 8 [(validate.rules).int32 = {gte: 0, lte: 500}];
  // 上一页返回的游标。查询条件应与上一页一致，首屏留空。
  string page_token = 9;
  // 指定稳定子账号 ID。留空时统计租户全部子账号。
  string client_id = 10 [(validate.rules).string = {uuid: true, ignore_empty: true}];
}

message UsageBucket {
  // 该统计桶的起始时间。
  google.protobuf.Timestamp start_time = 1;
  // 网关 ID。
  string gateway_id = 2;
  // 该时间段的流量统计。
  UsageAmount amount = 4;
}

message QueryUsageResponse {
  // 本页的用量统计桶。
  repeated UsageBucket buckets = 1;
  // 下一页的游标。为空表示没有更多记录。
  string next_page_token = 2;
}

message UsageAmount {
  // 写入代理的原始字节数。
  uint64 input_bytes = 1;
  // 代理发出的原始字节数。
  uint64 output_bytes = 2;
  // 原始输入和输出字节数之和。
  uint64 total_bytes = 3;
  // 实际扣减的字节数，首版按合格会话总字节 1:1 计量。
  uint64 billable_bytes = 4;
}
