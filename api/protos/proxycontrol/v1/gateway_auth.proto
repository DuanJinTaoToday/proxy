syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service GatewayAuthService {
  rpc LoadAuthState(LoadAuthStateRequest) returns (AuthSnapshot) {
    option (google.api.http) = { post: "/v1/gateway/auth-state/load" body: "*" };
    option (openapi.v3.operation) = {
      summary: "校验代理凭据并加载认证状态"
    };
  }
  rpc RefreshAuthState(RefreshAuthStateRequest) returns (RefreshAuthStateResponse) {
    option (google.api.http) = { post: "/v1/gateway/auth-state/refresh" body: "*" };
    option (openapi.v3.operation) = {
      summary: "批量刷新网关缓存的凭据和准入状态"
    };
  }
}

message LoadAuthStateRequest {
  // 用于认证的用户名。
  string username = 1 [(validate.rules).string = {min_bytes: 1, max_bytes: 255}];
  // 用于认证的原始密码。
  string password = 2 [(validate.rules).string = {min_bytes: 1, max_bytes: 255}];
}

message RefreshAuthStateRequest {
  // 本控制面签发给当前网关的凭据引用，每次提交 1–100 条。
  repeated string references = 1 [(validate.rules).repeated = {min_items: 1, max_items: 100, items: {string: {min_bytes: 1, max_bytes: 128}}}];
}

message RefreshAuthStateResponse {
  // 请求中各凭据引用对应的认证状态。
  repeated AuthSnapshot snapshots = 1;
}

message AuthSnapshot {
  // 绑定到当前网关的凭据引用，用于后续刷新。
  string reference = 1;
  // 用于认证的用户名。
  string username = 2;
  // 代理凭据 ID。
  string client_id = 3;
  // 租户 ID。
  string tenant_id = 4;
  // 供网关本地认证使用的密码哈希。
  bytes password_hash = 5;
  // 凭据当前是否启用且未过期。
  bool active = 6;
  // 失效时间。
  google.protobuf.Timestamp expires_at = 7;
  // 凭据允许访问的客户端来源网段，空列表表示不限制。
  repeated string allowed_source_cidrs = 8;
  // 有效凭据所属租户的流量准入状态。
  AuthQuota quota = 9;
}

message AuthQuota {
  // 可用流量余额，单位为字节。
  int64 available_bytes = 1;
  // 代理连接准入使用的最低可用余额阈值，单位为字节。
  uint64 admission_threshold_bytes = 2;
  // 网关可使用这份准入快照的截止时间。
  google.protobuf.Timestamp valid_until = 3;
}
