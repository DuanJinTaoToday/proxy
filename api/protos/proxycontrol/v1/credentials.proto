syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "proxycontrol/v1/common.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service CredentialService {
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/proxy-credentials"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "为租户签发代理凭据"
    };
  }
  rpc DisableCredential(DisableCredentialRequest) returns (BaseResp) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/proxy-credentials/{client_id}:disable"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "停用指定代理凭据"
    };
  }
}

message CreateCredentialRequest {
  // 租户 ID。
  string tenant_id = 1;
  // 凭据失效时间，省略时不设置有效期。
  google.protobuf.Timestamp expires_at = 2;
  // 凭据允许访问的客户端来源网段，空列表表示不限制。
  repeated string allowed_source_cidrs = 3 [(validate.rules).repeated.max_items = 100];
}

message CreateCredentialResponse {
  // 代理凭据 ID。
  string client_id = 1;
  // 用于认证的用户名。
  string username = 2;
  // 签发时返回的代理密码。
  string password = 3;
}

message DisableCredentialRequest {
  // 租户 ID。
  string tenant_id = 1;
  // 代理凭据 ID。
  string client_id = 2;
}
