syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service CredentialService {
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/proxy-credentials"
      body: "*"
    };
  }
  rpc DisableCredential(DisableCredentialRequest) returns (DisableCredentialResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/proxy-credentials/{client_id}:disable"
      body: "*"
    };
  }
}

message CreateCredentialRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  repeated string allowed_source_cidrs = 3;
}

message CreateCredentialResponse {
  string client_id = 1;
  string username = 2;
  string password = 3;
}

message DisableCredentialRequest {
  string tenant_id = 1;
  string client_id = 2;
}

message DisableCredentialResponse {}
