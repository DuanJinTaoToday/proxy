syntax = "proto3";

package proxycontrol.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "proxycontrol/v1/common.proto";
import "validate/validate.proto";

option go_package = "github.com/DuanJinTaoToday/proxy/api/proxycontrol/v1;proxycontrolv1";

service AccessService {
  rpc SendRegistrationCode(EmailRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/access/register-code", body: "*"};
    option (openapi.v3.operation) = {summary: "请求邮箱注册验证码"};
  }

  rpc ForgotPassword(EmailRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/access/forgot-password", body: "*"};
    option (openapi.v3.operation) = {summary: "请求邮箱密码找回链接"};
  }

  rpc ResetCustomerPassword(EmailCredentialRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/access:reset-password", body: "*"};
    option (openapi.v3.operation) = {summary: "通过邮箱链接重置客户密码"};
  }

  rpc RecoverCustomerEmail(EmailCredentialRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/access:recover-email", body: "*"};
    option (openapi.v3.operation) = {summary: "验证新邮箱并设置密码"};
  }

  rpc StartEmailRecovery(StartEmailRecoveryRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}:recover-email", body: "*"};
    option (openapi.v3.operation) = {summary: "运营核实归属后向新邮箱发送恢复链接"};
  }

  rpc Register(RegisterRequest) returns (TenantAccess) {
    option (google.api.http) = {post: "/v1/access/register", body: "*"};
    option (openapi.v3.operation) = {summary: "验证邮箱并注册租户管理员"};
  }

  rpc GetAccount(BaseRequest) returns (TenantAccess) {
    option (google.api.http) = {get: "/v1/tenant/account"};
    option (openapi.v3.operation) = {summary: "查看当前管理员所属租户"};
  }

  rpc GetTenantInvite(BaseRequest) returns (TenantInvite) {
    option (google.api.http) = {get: "/v1/tenant/invite"};
    option (openapi.v3.operation) = {summary: "查看已验证租户的专属邀请链接和邀请码"};
  }

  rpc GetTenantPromotion(TenantPromotionRequest) returns (TenantPromotion) {
    option (google.api.http) = {get: "/v1/operations/tenants/{tenant_id}/promotion"};
    option (openapi.v3.operation) = {summary: "运营查询租户推广资格"};
  }

  rpc PauseTenantPromotion(TenantPromotionRequest) returns (TenantPromotion) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}:pause-promotion"};
    option (openapi.v3.operation) = {summary: "运营暂停租户推广资格"};
  }

  rpc ResumeTenantPromotion(TenantPromotionRequest) returns (TenantPromotion) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}:resume-promotion"};
    option (openapi.v3.operation) = {summary: "运营恢复租户推广资格"};
  }

  rpc LoginOperator(LoginOperatorRequest) returns (LoginResponse) {
    option (google.api.http) = {post: "/v1/operations/access/login", body: "*"};
    option (openapi.v3.operation) = {summary: "登录运营控制台"};
  }

  rpc GetOperatorAccount(BaseRequest) returns (OperatorAccount) {
    option (google.api.http) = {get: "/v1/operations/access/account"};
    option (openapi.v3.operation) = {summary: "查看当前运营账号及其权限"};
  }

  rpc ResetTenantPassword(ResetTenantPasswordRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/operations/tenants/{tenant_id}:reset-password", body: "*"};
    option (openapi.v3.operation) = {summary: "运营核实租户归属后重置管理员密码"};
  }

  rpc CheckPermission(CheckPermissionRequest) returns (BaseResp) {
    option (google.api.http) = {post: "/v1/access/check", body: "*"};
    option (openapi.v3.operation) = {
      summary: "检查当前账号是否具备指定权限"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {post: "/v1/access/login", body: "*"};
    option (openapi.v3.operation) = {
      summary: "登录控制台并签发访问令牌"
    };
  }
}

message TenantAccess {
  // 租户 ID。
  string tenant_id = 1;
  // 租户显示名称。
  string name = 2;
  // 平台分配的全局唯一主账号名。
  string primary_account_name = 3;
  string email = 4;
}

message TenantInvite {
  // 租户固定邀请码，32 位十六进制字符。
  string invite_code = 1;
  // 控制台的 HTTPS 注册链接，使用 invite 查询参数携带邀请码。
  string invite_url = 2;
  // 推广资格为 active 或 paused。暂停时保留原邀请码和链接。
  string promotion_status = 3;
}

message TenantPromotionRequest {
  // 推广资格管理的目标租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
}

message TenantPromotion {
  // 推广资格为 active 或 paused。已验证邮箱的租户默认可推广。
  string promotion_status = 1;
}

message LoginRequest {
  reserved 1;
  reserved "phone";
  string email = 3 [(validate.rules).string = {min_len: 1}];
  // 控制台登录密码。
  string password = 2 [(validate.rules).string = {min_len: 1, max_bytes: 1024}];
}

message RegisterRequest {
  reserved 1;
  reserved "phone";
  string email = 3 [(validate.rules).string = {min_len: 1}];
  // 初始密码，至少 12 个字符。
  string password = 2 [(validate.rules).string = {min_len: 12, max_bytes: 1024}];
  string verification_code = 4 [(validate.rules).string = {min_len: 1, max_bytes: 16}];
  // 省略时使用链接值。提供非空手填码时覆盖链接值，提供空字符串时清除邀请归属。
  optional string invite_code = 5;
  // 邀请链接的 invite 查询参数。省略或为空时没有链接邀请码。
  string link_invite_code = 6;
}

message EmailRequest {
  string email = 1 [(validate.rules).string = {min_len: 1}];
}

message EmailCredentialRequest {
  string token = 1 [(validate.rules).string = {len: 43}];
  string password = 2 [(validate.rules).string = {min_len: 12, max_bytes: 1024}];
}

message StartEmailRecoveryRequest {
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  string email = 2 [(validate.rules).string = {min_len: 1}];
}

message LoginOperatorRequest {
  // 独立的运营登录名。
  string username = 1 [(validate.rules).string = {min_len: 1, max_bytes: 128}];
  // 运营登录密码。
  string password = 2 [(validate.rules).string = {min_len: 1, max_bytes: 1024}];
}

message OperatorAccount {
  string username = 1;
  // 独立授权项：read_operations、manage_billing、manage_tenant_accounts。
  repeated string permissions = 2;
}

message ResetTenantPasswordRequest {
  // 运营已核实归属的租户 ID。
  string tenant_id = 1 [(validate.rules).string = {min_len: 1, max_bytes: 64}];
  // 新密码，至少 12 个字符。
  string password = 2 [(validate.rules).string = {min_len: 12, max_bytes: 1024}];
}

message LoginResponse {
  // 后续请求通过 Authorization Bearer 发送的访问令牌。
  string access_token = 1;
  // 令牌从签发起的有效时长，单位为秒。
  int32 expires_in_seconds = 2;
}

enum Permission {
  reserved 2;
  reserved "PERMISSION_MANAGE_PROXY_CREDENTIALS";
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_READ_TENANT_USAGE = 1;
  PERMISSION_READ_OPERATIONS = 3;
  PERMISSION_MANAGE_BILLING = 4;
}

message CheckPermissionRequest {
  // 租户 ID。
  string tenant_id = 1;
  // 要检查的权限。
  Permission permission = 2;
}
