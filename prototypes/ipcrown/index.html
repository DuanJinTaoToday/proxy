<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="浏览 IPCrown 静态独享 IP 的节点、库存和分周期价格，试用模拟购买流程。">
<title>静态独享 IP · 购买原型</title>
<style>
:root{color-scheme:light;--ink:#152a31;--muted:#526970;--rule:#d9e3e4;--accent:#006454;--wash:#eef7f4}
*{box-sizing:border-box}
body{margin:0;background:#f4f7f7;color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--rule)}
header .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:750;display:flex;align-items:center;gap:10px}
.mark{background:var(--accent);color:white;border-radius:7px;padding:4px 8px;font:700 15px/1.5 monospace}
.tag{color:var(--accent);background:var(--wash);padding:5px 10px;border-radius:20px;font-size:13px}
main{padding:36px 0 48px}
h1,h2,p{margin:0} h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}
h2{font-size:20px}.intro p,.muted{color:var(--muted)}.intro p{margin-top:8px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:26px;align-items:start}
.panel{background:white;border:1px solid var(--rule);border-radius:14px;padding:20px;min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit;min-height:44px;border:1px solid #b6c9ca;border-radius:7px;background:white;padding:8px 12px}
button{cursor:pointer;font-weight:650;transition:background .15s,transform .15s}
button:hover:not(:disabled){background:var(--wash);transform:translateY(-1px)}
button:disabled,select:disabled,input:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.filters{margin:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#status{min-height:23px;margin-bottom:8px}
.nodes{display:grid;gap:8px}
.node{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;text-align:left;width:100%;padding:10px 12px}
.node[aria-pressed=true]{border-color:var(--accent);background:var(--wash)}
.node strong,.node small{display:block}.node small{color:var(--muted);font-weight:400}
.price,.total{font-variant-numeric:tabular-nums;white-space:nowrap}
.stock{font-size:13px;color:var(--muted);min-width:60px;text-align:right}
.checkout{position:sticky;top:20px}.checkout h2{margin-bottom:14px}
.field{display:grid;gap:5px;margin:12px 0}.field span{font-weight:650}
.total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding:14px 0;margin-top:16px}
.total{font-weight:750;font-size:24px;color:var(--accent)}
.primary{background:var(--accent);color:white;border-color:var(--accent);width:100%}
.primary:hover:not(:disabled){background:#004d41}
.note{font-size:13px;margin-top:9px}.feedback{margin-top:12px;overflow-wrap:anywhere}
.feedback:empty{display:none}.feedback.ok{padding:12px;background:var(--wash);border-radius:8px}.feedback.error{color:#a12925}
@media(max-width:760px){.layout{grid-template-columns:1fr}.checkout{position:static;grid-row:1} main{padding-top:24px}}
@media(max-width:400px){.panel{padding:12px}.node{gap:8px}.stock{min-width:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><div class="wrap"><span class="brand"><span class="mark" aria-hidden="true">IP</span> IPCrown 资源目录</span><span class="tag">本地原型</span></div></header>
<main class="wrap">
  <div class="intro"><h1>静态独享 IP</h1><p>查看 IPCrown 节点库存，按地区和租期配置订单。</p></div>
  <div class="layout">
    <section class="panel" aria-labelledby="nodes-heading">
      <div class="bar"><h2 id="nodes-heading">节点目录</h2><button type="button" id="refresh">刷新库存</button></div>
      <div class="filters"><label for="region">大洲</label><select id="region"><option value="">全部大洲</option></select></div>
      <p class="muted" id="status" role="status"></p>
      <div class="nodes" id="nodes"></div>
    </section>
    <section class="panel checkout" aria-labelledby="checkout-heading">
      <h2 id="checkout-heading">订单配置</h2>
      <p id="selected" class="muted">请选择一个有库存的节点。</p>
      <form id="order">
        <label class="field"><span>租用周期</span><select id="period" disabled></select></label>
        <label class="field"><span>购买数量</span><input id="quantity" type="number" min="1" step="1" value="1" required disabled></label>
        <div class="total-row"><span>预估合计</span><output class="total" id="total" for="period quantity">—</output></div>
        <button class="primary" id="submit" disabled>模拟购买</button>
        <p class="note muted">模拟订单仅在本地生成，实扣 ¥0.00。</p>
      </form>
      <p id="feedback" class="feedback" role="status"></p>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const labels = {yp1: '30 天', yp3: '90 天', yp6: '180 天', np: '360 天'};
let catalog = null;
let node = null;
let busy = false;
let loading = false;

async function api(url, options) {
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error);
  return body;
}

function renderNodes() {
  $('nodes').replaceChildren();
  if (!catalog) return;
  const visible = catalog.nodes.filter(item => !$('region').value || String(item.continentId) === $('region').value);
  for (const item of visible) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'node';
    button.disabled = loading || busy || !item.available || !item.prices.length;
    button.setAttribute('aria-pressed', String(node?.id === item.id));
    const title = document.createElement('span');
    const name = document.createElement('strong');
    const meta = document.createElement('small');
    name.textContent = item.name;
    meta.textContent = [item.isp, item.line].filter(Boolean).join(' · ');
    title.append(name, meta);
    const price = document.createElement('span');
    price.className = 'price';
    const monthly = item.prices.find(value => value.period === 'yp1');
    price.textContent = monthly ? '¥' + monthly.unitPrice + ' / 30 天' : '—';
    const stock = document.createElement('span');
    stock.className = 'stock';
    stock.textContent = item.available ? '剩余 ' + item.available : '售罄';
    button.append(title, price, stock);
    button.onclick = () => {
      $('feedback').textContent = '';
      selectNode(item);
      for (const row of $('nodes').children) row.setAttribute('aria-pressed', String(row === button));
    };
    $('nodes').append(button);
  }
  if (!visible.length) $('nodes').textContent = '这个大洲暂无节点。';
}

function selectNode(item, preferredPeriod) {
  node = item;
  $('selected').textContent = item ? item.name + ' · 剩余 ' + item.available + ' 个 IP' : '请选择一个有库存的节点。';
  $('period').replaceChildren(...(item?.prices || []).map(price =>
    new Option(labels[price.period] + ' · ¥' + price.unitPrice + ' / IP', price.period)));
  if (item?.prices.some(price => price.period === preferredPeriod)) $('period').value = preferredPeriod;
  $('quantity').max = item ? item.available : '';
  if (!item) $('quantity').value = 1;
  else if ($('quantity').valueAsNumber > item.available) $('quantity').value = item.available;
  quote();
}

function quote() {
  const price = node?.prices.find(item => item.period === $('period').value);
  const quantity = $('quantity').valueAsNumber;
  $('period').disabled = $('quantity').disabled = !node || busy || loading;
  const valid = price && Number.isInteger(quantity) && quantity > 0 && quantity <= node.available;
  $('submit').disabled = !valid || busy || loading;
  $('total').textContent = valid ? '¥' + (Math.round(Number(price.unitPrice) * 100) * quantity / 100).toFixed(2) : '—';
  return valid ? price : null;
}

async function load() {
  loading = true;
  $('refresh').disabled = true;
  $('status').textContent = '正在读取 IPCrown 目录…';
  $('feedback').textContent = '';
  renderNodes();
  quote();
  try {
    const selectedRegion = $('region').value;
    catalog = await api('/api/catalog');
    $('region').replaceChildren(new Option('全部大洲', ''), ...catalog.continents.map(item => new Option(item.name, item.id)));
    if (catalog.continents.some(item => String(item.id) === selectedRegion)) $('region').value = selectedRegion;
    const updated = catalog.nodes.find(item => item.id === node?.id && item.available && item.prices.length);
    selectNode(updated || null, $('period').value);
    const stock = catalog.nodes.reduce((sum, item) => sum + item.available, 0);
    const time = new Date(catalog.fetchedAt * 1000).toLocaleTimeString('zh-CN');
    $('status').textContent = catalog.nodes.length + ' 个节点 · ' + stock.toLocaleString('zh-CN') + ' 个可用 IP · 更新于 ' + time;
  } catch (error) {
    catalog = null;
    selectNode(null);
    $('status').textContent = error.message;
  } finally {
    loading = false;
    $('refresh').disabled = false;
    renderNodes();
    quote();
  }
}

$('refresh').onclick = load;
$('region').onchange = renderNodes;
$('period').onchange = $('quantity').oninput = () => {
  $('feedback').textContent = '';
  quote();
};
$('order').onsubmit = async event => {
  event.preventDefault();
  const price = quote();
  if (!price || busy || loading) return;
  const order = {nodeId: node.id, period: price.period, quantity: $('quantity').valueAsNumber, unitPrice: price.unitPrice};
  busy = true;
  $('refresh').disabled = true;
  for (const row of $('nodes').children) row.disabled = true;
  quote();
  $('feedback').className = 'feedback';
  $('feedback').textContent = '正在校验价格和库存…';
  try {
    const result = await api('/api/simulated-orders', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(order)});
    $('feedback').className = 'feedback ok';
    $('feedback').textContent = '模拟订单 ' + result.orderId + ' 已生成。' + result.node + ' · ' + labels[result.period] + ' · ' + result.quantity + ' 个 IP。预估 ¥' + result.total + '，实扣 ¥' + result.charged + '。';
  } catch (error) {
    $('feedback').className = 'feedback error';
    $('feedback').textContent = error.message;
  } finally {
    busy = false;
    $('refresh').disabled = false;
    renderNodes();
    quote();
  }
};
load();
</script>
</html>
