name: proxy-test

x-build: &build
  context: ../..
  dockerfile: deploy/test/Dockerfile

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy-local-test
      POSTGRES_DB: proxy
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "proxy", "-d", "proxy"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      <<: *build
      target: migrate
    environment:
      PG_DSN: postgres://proxy:proxy-local-test@db:5432/proxy?sslmode=disable
    command:
      - sh
      - -ec
      - |
        goose -dir /migrations postgres "$$PG_DSN" up
        psql "$$PG_DSN" -v ON_ERROR_STOP=1 -f /seed.sql

  control:
    image: proxy-control:0.0.1
    container_name: control-1
    build:
      <<: *build
      target: control
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  console:
    image: proxy-console:0.0.1
    container_name: console-1
    build:
      <<: *build
      target: console
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - caddy:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  proxy-wukong-mock:
    image: proxy-wukong-mock:0.0.1
    container_name: wukong-mock-1
    build:
      <<: *build
      target: wukong-mock
    platform: linux/amd64
    command: ["-L", "socks5://:1081"]
    healthcheck:
      test: ["CMD-SHELL", "awk '$$2 ~ /:0439$$/ && $$4 == \"0A\" { ready = 1 } END { exit !ready }' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  gateway:
    image: proxy-gateway:0.0.1
    container_name: gateway-1
    build:
      <<: *build
      target: gateway
    platform: linux/amd64
    depends_on:
      console:
        condition: service_healthy
      proxy-wukong-mock:
        condition: service_healthy
    ports:
      - "127.0.0.1:1080:1080"
    volumes:
      - caddy:/tls:ro
      - recorder:/spool
    healthcheck:
      # Inspect the listener without creating Recorder traffic.
      test: ["CMD-SHELL", "awk '$$2 ~ /:0438$$/ && $$4 == \"0A\" { ready = 1 } END { exit !ready }' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  db:
  caddy:
  recorder:
